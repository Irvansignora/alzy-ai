name = "daftar-job"
main = "src/worker.js"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "daftar-job.iranza.com", custom_domain = true }
]

[vars]
# Google Sheet "Daftar Lowongan" (Kategori | Nama Job | Status | Keterangan).
# Kalau belum di-share "Siapa saja yang memiliki link", form pakai DEFAULT_JOBS di src/worker.js.
JOBS_SHEET_ID = "1AZL6lB-AR_ireCJWKyE2a4k_p_txXSylb_TfP6TT-no"
# Halaman /admin dikunci Cloudflare Access (app "daftar-job admin"); worker juga cek JWT-nya
ACCESS_TEAM = "square-pond-fb4a.cloudflareaccess.com"
ACCESS_AUD = "2db92d99a632eb1f89f5e901c219d0f7c33bfcee59a0375f2f696961b4fe8704"
ADMIN_EMAILS = "irvansignora@gmail.com,irvansignora2@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "daftar-job"
database_id = "b0f80f22-d061-4a80-ae1e-6ae79ea75b98"

[[r2_buckets]]
binding = "FILES"
bucket_name = "daftar-job-files"

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Secret: wrangler secret put EXPORT_KEY
